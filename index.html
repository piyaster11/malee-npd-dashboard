<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Unofficial new-product dashboard — market insights (public data) + SAMPLE tools</title>
<meta name="robots" content="noindex,nofollow">
<style>

:root{
  --bg:#ffffff; --bg2:#f7f8f7; --ink:#14181b; --mute:#667075; --faint:#98a1a5; --line:#e6e9e8;
  --accent:#0a7b5c; --accent-soft:#e6f3ee; --warn:#b26a00; --warn-soft:#fff5e0; --bad:#b3261e; --bad-soft:#fdecea;
  --radius:10px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans","Noto Sans Thai","Sarabun",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
/* sample banner: sticky on every view */
.banner{position:sticky;top:0;z-index:50;background:var(--warn-soft);border-bottom:1px solid #f0d9a6;color:#5a3b00;padding:7px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.banner b{letter-spacing:.04em;font-size:13px}
.banner span{color:#7a5a1a}
header.top{border-bottom:1px solid var(--line);background:#fff}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
.hrow{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 0 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.brand small{color:var(--mute)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 11px;font:inherit;color:var(--mute);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
input[type=date],input[type=number],input[type=search],select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff;color:var(--ink)}
input[type=number]{width:70px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font:inherit;color:var(--mute);cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin-right:2px}
nav.tabs{position:sticky;top:34px;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{border:0;background:none;font:inherit;color:var(--mute);padding:11px 12px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{padding:20px 0 60px}
.panel{display:none}.panel.on{display:block}
h2{font-size:16px;margin:0 0 4px;font-weight:650;letter-spacing:-.005em}
h3{font-size:13px;margin:0 0 8px;font-weight:600;color:var(--ink)}
.sub{color:var(--mute);margin:0 0 16px;font-size:13px;max-width:900px}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid #e9cf94;color:#7a5a1a;background:var(--warn-soft);border-radius:4px;padding:1px 6px;vertical-align:middle;margin-left:6px}
.tag.live{border-color:#9fd3bf;color:var(--accent);background:var(--accent-soft)}
.tag.grey{border-color:var(--line);color:var(--mute);background:var(--bg2)}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:#fff;min-width:0}
.tile .k{font-size:12px;color:var(--mute);margin-bottom:4px}
.tile .v{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.15}
.tile.sm .v{font-size:20px}
.tile .d{font-size:12px;margin-top:4px;color:var(--mute)}
.d .up{color:var(--ink)} .d .good{color:var(--accent)} .d .bad{color:var(--bad)}
.tile .t{font-size:11.5px;color:var(--faint);margin-top:2px}
.spark{display:block;margin-top:8px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.split{display:grid;grid-template-columns:2fr 1fr;gap:12px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-weight:600;color:var(--mute);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg2);position:sticky;top:0}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
th.num,td.num{text-align:right}
td.wrapc{white-space:normal;min-width:220px}
tr.sub td{color:var(--mute)}
tr.total td{font-weight:600;background:var(--bg2)}
tr.ph td{color:var(--faint);font-style:italic}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11.5px;border:1px solid var(--line);color:var(--mute);background:#fff}
.pill.high{border-color:#efb6b1;background:var(--bad-soft);color:var(--bad)}
.pill.med{border-color:#ecd29b;background:var(--warn-soft);color:var(--warn)}
.pill.low{border-color:var(--line);background:var(--bg2);color:var(--mute)}
.pill.ok{border-color:#a9d6c5;background:var(--accent-soft);color:var(--accent)}
.pill.a{border-color:#a9d6c5;background:var(--accent-soft);color:var(--accent)}
.pill.b{border-color:#ecd29b;background:var(--warn-soft);color:var(--warn)}
.pill.c{border-color:var(--line);background:var(--bg2);color:var(--ink)}
.bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;min-width:80px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.warn i{background:#d79a2b}.bar.bad i{background:var(--bad)}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--mute)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.alert:last-child{border-bottom:0}
.alert .t{font-weight:600}.alert .m{color:var(--mute);font-size:12.5px}
.alert .act{font-size:12.5px;margin-top:4px}
.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--bg2);border-radius:6px;padding:10px 14px;font-size:13px;color:var(--ink);margin-bottom:14px}
.callout.warn{border-left-color:#d79a2b;background:var(--warn-soft)}
.cthumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cr{display:flex;gap:12px}
.cr svg.th{flex:none;border-radius:8px;border:1px solid var(--line)}
.cr .n{font-weight:600;font-size:13px}.cr .s{color:var(--mute);font-size:12px}
.note{font-size:12px;color:var(--mute)}
.narr p{margin:0 0 10px;max-width:880px}
.narr h3{margin-top:16px}
.narr ul{margin:0 0 10px 18px;padding:0;max-width:880px}
.narr li{margin-bottom:4px}
.conn{display:flex;flex-direction:column;gap:8px}
.conn .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.conn .nm{font-weight:650;font-size:15px}
.conn ul{margin:4px 0 0 16px;padding:0;color:var(--mute);font-size:12.5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint);margin-right:6px}
.livebox{border:1px dashed #9fd3bf;background:#fbfefd;border-radius:var(--radius);padding:14px 16px}
.small{font-size:12px}
details{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:14px;background:#fff}
summary{cursor:pointer;color:var(--mute);font-size:13px}
details dl{margin:8px 0 0;display:grid;grid-template-columns:150px 1fr;gap:4px 14px;font-size:12.5px}
details dt{font-weight:600}details dd{margin:0;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:18px 0 40px;color:var(--faint);font-size:12px}
@media (max-width:1100px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.cthumbs{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .wrap{padding:0 12px}.banner{padding:6px 12px;font-size:11.5px}
  .g5,.g4,.g3,.g2,.cthumbs{grid-template-columns:1fr 1fr}
  .g3,.g2.stk{grid-template-columns:1fr}
  .tile .v{font-size:21px}.tile.sm .v{font-size:18px}
  .hrow{padding-top:10px}.controls{width:100%}
  .alert{grid-template-columns:1fr}
  details dl{grid-template-columns:1fr}
  nav.tabs{top:56px}
}
@media (max-width:420px){.g5,.g4,.cthumbs{grid-template-columns:1fr 1fr}.card{padding:12px}}

.info{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;margin-left:6px;border:1px solid var(--faint);border-radius:50%;font-size:9px;font-style:italic;font-weight:700;color:var(--mute);cursor:help;vertical-align:1px;position:static}
.info:hover,.info:focus{border-color:var(--accent);color:var(--accent);outline:none}
.tile{position:relative}
.info::after{content:attr(data-tip);display:none;position:absolute;left:10px;right:10px;top:34px;z-index:30;background:#14181b;color:#fff;font:400 12px/1.4 var(--font);font-style:normal;padding:8px 10px;border-radius:6px;text-align:left}
.info:hover::after,.info:focus::after{display:block}
p.help{margin:0 0 14px;padding:7px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);color:#24433a;font-size:13px;border-radius:0 6px 6px 0;max-width:980px}
body[data-tab=summary] #hrow2,body[data-tab=summary] #ctl1,body[data-tab=summary] #rangeNote{display:none}
body[data-tab=summary] .hrow{padding-bottom:12px}
h3.sec{font-size:15px;margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.stand{padding:16px 18px}
.stand.green{border-color:#a9d6c5}.stand.amber{border-color:#e6c27a}.stand.red{border-color:#efb6b1}
.lights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 14px}
.light{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.ldot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none}
.ldot.lg{width:16px;height:16px;margin-top:2px}
.ldot.green{background:#2f9e6f}.ldot.amber{background:#e0a21a}.ldot.red{background:#d64541}
.bigline{display:flex;gap:10px;align-items:center;font-size:15px;margin-bottom:8px}
ol.three{margin:0 0 0 18px;padding:0}ol.three li{margin-bottom:6px;max-width:960px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.act .ahead{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.act .ahead b{font-size:14px;line-height:1.35}.act .ahead .pill{margin-left:auto;flex:none}
.rank{flex:none;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.act p{margin:6px 0}.k2{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:1px}
.act .meta{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0}
.act .meta .k2{display:inline;margin-right:6px}
.recbox{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin-top:6px;color:#14352c}
.recbox .k2{color:#3a6b5c}
.opps,.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opp p,.recs p{margin:6px 0;color:var(--ink)}
.gloss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 22px}
.gloss b{font-size:13px}
@media (max-width:1100px){.acts,.opps,.recs{grid-template-columns:1fr}.gloss{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.lights,.gloss{grid-template-columns:1fr}.stand{padding:12px}}
@media print{
 @page{size:A4;margin:8mm}
 body{font-size:8.2pt;line-height:1.3}
 .noprint,nav.tabs,header.top .controls,#hrow2,footer{display:none!important}
 .banner{position:static;padding:3px 8px;font-size:7.5pt}
 header.top{border:0}.hrow{padding:4px 0}
 .wrap{max-width:none;padding:0}
 main{padding:4px 0}
 .card{break-inside:avoid;padding:6px 8px;border-radius:6px}
 .sub,p.help{display:none}
 h2{font-size:12pt}h3.sec{font-size:9.5pt;margin:7px 0 4px;padding-top:4px}
 .stand{padding:6px 8px}.lights{gap:6px;margin:2px 0 4px}.light{padding:2px 0}
 .acts{grid-template-columns:repeat(3,1fr);gap:5px}.opps,.recs{grid-template-columns:repeat(2,1fr);gap:5px}
 .recs{grid-template-columns:repeat(3,1fr)}
 .gloss{grid-template-columns:repeat(4,1fr);gap:3px 10px}.gloss .note,.note{font-size:7pt}
 .act p{margin:2px 0}.act .ahead b{font-size:8.2pt}.recbox{padding:3px 5px;margin-top:2px}
 .k2{font-size:6.3pt}.pill{font-size:6.8pt;padding:0 5px}
 .act .meta{margin:3px 0;gap:8px}
 ol.three{font-size:8.2pt}.bigline{font-size:9pt;margin-bottom:2px}
 .tag{font-size:6.5pt}
}
body.printmode .noprint{display:none!important}

/* ===== NPD-specific additions ===== */
.tag.pub{border-color:#9fd3bf;color:var(--accent);background:var(--accent-soft)}
.tag.you{border-color:#b9c7f0;color:#2b4a9e;background:#eef2fd}
.hdr-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thnote{display:none;background:#eef2fd;border-bottom:1px solid #cdd8f5;color:#2b4a9e;font-size:12.5px;padding:6px 20px}
body[data-lg=th] .thnote{display:block}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-width:0}
.col h4{margin:0 0 2px;font-size:13px;font-weight:650}
.col .gq{font-size:11.5px;color:var(--mute);margin:0 0 8px}
.col details{margin:0 0 8px;padding:5px 8px;font-size:11.5px}
.col details summary{font-size:11.5px}
.col details ul{margin:4px 0 0 14px;padding:0;color:var(--mute)}
.icard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;font-size:12.5px}
.icard .nm{font-weight:600;line-height:1.3;margin-bottom:5px}
.icard .id{color:var(--faint);font-size:11px;margin-right:4px}
.icard .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.score{display:inline-block;min-width:38px;text-align:center;border-radius:6px;padding:1px 7px;font-weight:650;border:1px solid var(--line)}
.score.go{background:var(--accent-soft);color:var(--accent);border-color:#a9d6c5}
.score.hold{background:var(--warn-soft);color:var(--warn);border-color:#ecd29b}
.score.kill{background:var(--bad-soft);color:var(--bad);border-color:#efb6b1}
.ev{font-size:11px;color:var(--mute)}
.ev i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--faint)}
.ev.l1 i{background:#d64541}.ev.l2 i{background:#e0a21a}.ev.l3 i{background:#7cc4a4}.ev.l4 i,.ev.l5 i{background:#2f9e6f}
.flag{font-size:11px;color:var(--bad);margin-top:5px}
.empty{color:var(--faint);font-style:italic;font-size:12px}
.sc input[type=number]{width:54px;text-align:center;padding:4px 4px}
.sc td.w input{background:var(--accent-soft)}
.sc th.crit{white-space:normal;min-width:92px;vertical-align:bottom}
.sc td.nm{white-space:normal;min-width:220px}
.slotrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.slotrow .slot{border:1px dashed var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.slotrow .slot.fill{border:1px solid #a9d6c5;background:var(--accent-soft)}
button.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 11px;cursor:pointer;color:var(--ink)}
button.btn:hover{border-color:var(--accent);color:var(--accent)}
button.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.btn.pri:hover{background:#000;color:#fff}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:start}
.chk:first-child{border-top:0}
.chk input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.chk .tx{min-width:0}
.chk .nt{width:100%;margin-top:4px;font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 7px}
.crit-t{color:var(--bad);font-size:11px;margin-left:6px}
.bot{font-size:10.5px;border:1px solid #b9c7f0;background:#eef2fd;color:#2b4a9e;border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.charts svg{width:100%;height:auto;display:block}
.verdict{border-radius:var(--radius);padding:14px 16px;border:1px solid var(--line);margin-bottom:12px}
.verdict.scale{background:var(--accent-soft);border-color:#a9d6c5}
.verdict.fix{background:var(--warn-soft);border-color:#ecd29b}
.verdict.kill{background:var(--bad-soft);border-color:#efb6b1}
.verdict.wait{background:var(--bg2)}
.verdict .big{font-size:20px;font-weight:700;letter-spacing:-.01em}
.verdict ul{margin:6px 0 0 18px;padding:0}
.thr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 16px}
.thr label{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12.5px}
.livebox textarea{width:100%;min-height:90px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line);border-radius:8px;padding:8px}
.pm label{display:block;font-weight:600;font-size:12.5px;margin:12px 0 3px}
.pm textarea,.pm input[type=text]{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.pm textarea{min-height:64px;resize:vertical}
.pm .hint{font-weight:400;color:var(--mute);font-size:12px}
.pm .cg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px}
.pm .cg label{font-weight:400;margin:2px 0;display:flex;gap:6px;align-items:flex-start}
.pm .g2f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.facts td.src{white-space:normal;min-width:180px;font-size:12px}
.facts td.wrapc{min-width:260px}
.dtable select{font-size:12.5px}
.dtable input[type=text]{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;width:120px}
.pri1{color:var(--bad);font-weight:600}.pri2{color:var(--warn);font-weight:600}.pri3{color:var(--mute)}
.crit-guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.crit-guide .card{padding:10px 12px;font-size:12.5px}
.crit-guide .card b{display:block;margin-bottom:2px}
.crit-guide dl{margin:6px 0 0;display:grid;grid-template-columns:22px 1fr;gap:2px 8px;color:var(--mute)}
.crit-guide dt{font-weight:700;color:var(--ink)}.crit-guide dd{margin:0}
@media (max-width:1100px){

function lanes(vals,minGap){const last=[];return vals.map(v=>{let k=0;while(last[k]!==undefined&&v-last[k]<minGap)k++;last[k]=v;return k})}
function ladderGroup(g){
  const rows=PRICES.filter(p=>p.g===g[0]).sort((a,b)=>a.reg-b.reg);
  if(!rows.length)return '';

  const gaps=[];if(rows.length>=8)for(let i=1;i<rows.length;i++){const d=rows[i].reg-rows[i-1].reg;if(d>=1.2)gaps.push([rows[i-1].reg,rows[i].reg])}

  return `<div class="lad"><h3>${L(g[1],g[2])} <span class="note">· ${rows.length} ${L('prices','ราคา')}</span></h3><div class="strip" style="height:${H}px">${gp}${ticks}${dots}${promo}</div>

/* Trend per launch: REAL Google Trends search interest for Thailand (refresh/pull_launch_trends.py -> launch_trends.js). A proxy for shopper attention, NOT sales. */
function ltDate(){const t=(typeof LAUNCH_TRENDS!=='undefined'&&LAUNCH_TRENDS.pulled_at)||'';const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(t);if(!m)return L('not pulled','ยังไม่ได้ดึง');
  return L(`${+m[3]} ${MON[+m[2]-1][0]} ${m[1]}`,`${+m[3]} ${MON[+m[2]-1][1]} ${+m[1]+543}`)}
function trendCell(r){const T=(typeof LAUNCH_TRENDS!=='undefined'&&LAUNCH_TRENDS.items)||{};const t=T[r[0]+'|'+r[2]];
  const td=h=>`<td class="w" style="white-space:nowrap">${h}</td>`;
  if(!t)return td(`<b style="color:var(--mute)">—</b><br><span class="note">${L('Not pulled yet','ยังไม่ได้ดึงข้อมูล')}</span><br>${LB('nf')}`);
  if(t.status==='na')return td(`<b style="color:var(--mute)">n/a</b><br><span class="note">${L('Launched outside Thailand','เปิดตัวนอกประเทศไทย')}</span>`);
  if(t.status!=='ok'||typeof t.change_pct!=='number'||!isFinite(t.change_pct))return td(`<b style="color:var(--mute)">—</b><br><span class="note">${L('Too few searches to measure','มีคนค้นหาน้อยเกินกว่าจะวัดได้')}</span><br>${t.term?`<span class="note">${L('Search term','คำค้น')}: ${esc(t.term)}</span><br>`:''}${LB('nf')}`);
  const c=t.change_pct,n=Math.round(Math.abs(c)),d=t.direction;
  const head=d==='up'?`<b style="color:var(--accent)">▲ +${n}%</b>`:d==='down'?`<b style="color:var(--bad)">▼ −${n}%</b>`:`<b style="color:var(--mute)">► ${L('~flat','ทรงตัว')} <span style="font-weight:400">(${c<0?'−':'+'}${n}%)</span></b>`;
  return td(`${head}<br><span class="note">${L('Searches, last 4 wks vs prior 4 wks','การค้นหา 4 สัปดาห์ล่าสุด เทียบ 4 สัปดาห์ก่อนหน้า')}</span><br><span class="note">${L('Search term','คำค้น')}: ${esc(t.term)}</span><br>${LB('real')}`);}

/* ---------- tie-in used by the Score-the-ideas tab ---------- */
function wsFor(id){return WS.find(w=>w[6]===id)}
function mktBlock(id){
  const w=wsFor(id);
  if(!w)return `<div class="mk"><b>${esc(id)}</b> — ${LB('nf')} ${L('No market evidence linked to this idea yet. Add it on the Market insights tab.','ยังไม่ได้เชื่อมหลักฐานตลาดกับไอเดียนี้')}</div>`;
  return `<div class="mk"><b>${esc(id)}</b> → ${L('map point','จุดบนแผนที่')} #${w[0]} · ${L('market evidence','หลักฐานตลาด')} ${evd(w[5])} ${LB(w[5]==='weak'?'nf':'real')}
   <p>${L(w[8],w[9])}</p><p class="note"><b>${L('Growth basis','ที่มาของการเติบโต')}:</b> ${L(w[14],w[15])} · <b>${L('Brands seen','แบรนด์ที่เจอ')}:</b> ${L(w[10],w[11])}</p><p>${trendChip(w[7])}</p></div>`;
}
function vScoreEvidence(){
  return `<h3 class="sec">${L('What the market data says about each idea','ข้อมูลตลาดบอกอะไรเกี่ยวกับแต่ละไอเดีย')} ${SAMP()}</h3>
  <p class="help">${L('The idea names and scores above are SAMPLE. The market evidence below comes from the Market insights tab (real public data where marked). It is a hypothesis to test, not a recommendation. “Market evidence” (how strongly public data supports demand) is different from the “Proof” column (how far Malee has tested the idea itself).','ชื่อไอเดียและคะแนนด้านบนเป็นตัวอย่าง ส่วนหลักฐานตลาดด้านล่างมาจากแท็บ Market insights (ข้อมูลจริงตามที่ระบุ) เป็นสมมติฐานที่ต้องทดสอบ ไม่ใช่คำแนะนำ “หลักฐานตลาด” (ข้อมูลสาธารณะสนับสนุนความต้องการแค่ไหน) ต่างจากคอลัมน์ “หลักฐาน” (Malee ทดสอบไอเดียนี้ไปแค่ไหน)')}</p>
  <div class="cards2">${state.ideas.filter(i=>!i.custom).map(i=>`<div class="card"><b>${esc(i.id)} · ${esc(T(i))}</b>${mktBlock(i.id)}</div>`).join('')}</div>
  <p style="margin-top:10px"><button class="btn" data-tab="insights">${L('Open Market insights','เปิดแท็บ Market insights')}</button></p>`;
}

/* ---------- the tab ---------- */
function top5(){
  const ok=TWORDS.map(t=>({t,a:tAnalyze(t[0])})).filter(x=>x.a&&x.a.yoy!=null&&x.a.level>=5);
  const up=ok.filter(x=>x.a.yoy>10).sort((a,b)=>b.a.yoy-a.a.yoy).slice(0,3),dn=ok.filter(x=>x.a.yoy<-10).sort((a,b)=>a.a.yoy-b.a.yoy).slice(0,2);
  const nm=x=>`${L(x.t[2]+' · '+x.t[1],x.t[1])} (${sgn(x.a.yoy)}%)`;
  const five=ok.length?[(up.length?L('rising vs the year before — ','เพิ่มกว่าปีก่อน — ')+up.map(nm).join(', ')+'. ':'')+(dn.length?L('falling — ','ลดลง — ')+dn.map(nm).join(', ')+'.':''),L('Google Trends (Thailand, weekly, last 52 weeks vs the 52 before). Search is interest, not sales; use it to pick what to test.','Google Trends (ไทย รายสัปดาห์ 52 สัปดาห์ล่าสุดเทียบ 52 สัปดาห์ก่อนหน้า) การค้นหาคือความสนใจ ไม่ใช่ยอดขาย ใช้เพื่อเลือกสิ่งที่จะทดสอบ'),'trends']:
   [L('Protein and functional drinks are small but growing faster than juice: protein milk from about ฿3.5bn to ฿5bn; functional drinks about +7% a year.','เครื่องดื่มโปรตีนและฟังก์ชันยังเล็กแต่โตเร็วกว่าน้ำผลไม้: นมโปรตีนจากราว 3.5 เป็น 5 พันล้านบาท ฟังก์ชันราว +7% ต่อปี'),L('Search data not available this time. Company figures; the ฿3.5bn → ฿5bn is from one press story.','ครั้งนี้ไม่มีข้อมูลค้นหา ตัวเลขจากบริษัท และ 3.5 → 5 พันล้าน มาจากข่าวเดียว'),'bbn'];
  const items=[
   [L('Money is moving up to real juice.','เงินกำลังย้ายขึ้นไปหาน้ำผลไม้แท้'),L('Premium juice (90–100%) grew +24% in the 12 months to Jun 2026 and is now 38% of juice value. The middle group (26–89% juice) fell −19% and economy −5%.','น้ำผลไม้พรีเมียม (90–100%) โต +24% ใน 12 เดือนถึง มิ.ย. 2569 และเป็น 38% ของมูลค่า กลุ่มกลาง (26–89%) ลด −19% และประหยัด −5%'),L('Source: Malee Q2/2026 report (Nielsen), 17 Aug 2026. Part of “premium” is coconut water.','แหล่ง: รายงานไตรมาส 2/2569 ของ Malee (Nielsen) 17 ส.ค. 2569 พรีเมียมรวมน้ำมะพร้าวบางส่วน'),'q226'],
   [L('Coconut water is the fast lane, but a crowded one.','น้ำมะพร้าวคือเลนที่โตเร็ว แต่แออัด'),L('Ready-to-drink coconut water grew +80% in 2025 to about ฿1.8bn — still small beside juice (฿11.2bn). We found 9 brands in shop-website prices, Tipco has said it plans new drinks, raw coconut price is −49%, and 3 of the 8 makers listed lost money.','น้ำมะพร้าวพร้อมดื่มโต +80% ในปี 2568 เป็นราว 1.8 พันล้านบาท ยังเล็กเมื่อเทียบน้ำผลไม้ (11.2 พันล้านบาท) เจอ 9 แบรนด์ในราคาจากเว็บไซต์ร้านค้า Tipco บอกว่าจะออกเครื่องดื่มใหม่ ราคามะพร้าวดิบ −49% และ 3 จาก 8 ผู้ผลิตที่ลิสต์ขาดทุน'),L('Sources: Forbes TH 27 Feb 2026; LH Bank Jul 2026; shop-website price checks 25 Sep 2026. Matcha at ฿35 is +30% over plain ฿27: shoppers may pay more for a clear new reason (sell-out not public).','แหล่ง: Forbes TH 27 ก.พ. 2569; LH Bank ก.ค. 2569; เช็คราคาเว็บไซต์ร้านค้า 25 ก.ย. 2569 มัทฉะ ฿35 แพงกว่าธรรมดา ฿27 อยู่ 30% คนอาจจ่ายเพิ่มถ้ามีเหตุผลใหม่ชัดเจน (ยอดขายไม่เปิดเผย)'),'forbes'],
   [L('Tipco is cutting 100% juice prices hard; Malee barely discounts.','Tipco ลดราคาน้ำผลไม้ 100% หนัก ส่วน Malee ลดน้อย'),L('At Lotus’s on 25 Sep 2026, Tipco 100% orange 1 L was ฿70 (−21% from ฿89); Malee 100% apple 1 L was ฿85 (−4%). Tipco has also just relaunched NFC orange in 200 ml. A “me-too” 100% juice would meet a price war.','ที่ Lotus’s 25 ก.ย. 2569 Tipco ส้ม 100% 1 ลิตร ฿70 (−21% จาก ฿89) Malee แอปเปิล 100% 1 ลิตร ฿85 (−4%) และ Tipco เพิ่งออก NFC ส้ม 200 มล. ใหม่ น้ำผลไม้ 100% แบบเลียนแบบจะเจอสงครามราคา'),L('Source: retailer website price check, 25 Sep 2026; Brand Buffet 18 Aug 2026.','แหล่ง: ราคาจากเว็บไซต์ร้านค้า 25 ก.ย. 2569; Brand Buffet 18 ส.ค. 2569'),'cw'],
   [L('Rules decide what you can launch.','กฎหมายกำหนดว่าเปิดตัวอะไรได้'),L('Sugar tax step 4 has been in force since 1 Apr 2025: under 6 g sugar per 100 ml pays nothing; 6–8 g pays ฿1 per litre. Health claims are allowed only from Thai FDA lists since 2 Jul 2024. Watch out: the “lighter juice” group (26–89%) is the one falling −19%.','ภาษีน้ำตาลขั้นที่ 4 ใช้ตั้งแต่ 1 เม.ย. 2568: น้ำตาลต่ำกว่า 6 กรัม/100 มล. ไม่เสียภาษี 6–8 กรัม ลิตรละ ฿1 คำโฆษณาสุขภาพใช้ได้เฉพาะรายการของ อย. ตั้งแต่ 2 ก.ค. 2567 ระวัง: กลุ่ม “น้ำผลไม้เจือจาง” (26–89%) คือกลุ่มที่ลด −19%'),L('Sources: Thai Rath / Bangkok Global Law 15 May 2025; Thai FDA No. 447.','แหล่ง: ไทยรัฐ / Bangkok Global Law 15 พ.ค. 2568; อย. ฉบับที่ 447'),'bgl'],
   [L('Thai searches are shifting.','สิ่งที่คนไทยค้นหากำลังเปลี่ยน'),five[0],five[1]]];
  return `<ol class="top5">${items.map(i=>`<li><b>${i[0]}</b>${i[1]}<div class="why">${i[2]}</div></li>`).join('')}</ol>`;
}
function fresh(){
  let rt=L('not pulled','ยังไม่ได้ดึง');
  if(TRENDS.retrieved){const pr={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date(TRENDS.retrieved)).forEach(x=>pr[x.type]=x.value);
   rt=L(`${pr.day} ${MON[+pr.month-1][0]} ${pr.year}, ${pr.hour}:${pr.minute} (Bangkok)`,`${pr.day} ${MON[+pr.month-1][1]} ${+pr.year+543} เวลา ${pr.hour}:${pr.minute} น. (กรุงเทพฯ)`)}
  return `<div class="fresh"><b>${L('Data freshness','ความใหม่ของข้อมูล')}:</b> ${L('market numbers up to Jun 2026 (Malee report 17 Aug 2026) · shop-website prices 25 Sep 2026 · launches up to 25 Sep 2026 · Google Trends pulled ','ตัวเลขตลาดถึง มิ.ย. 2569 (รายงาน Malee 17 ส.ค. 2569) · ราคาจากเว็บไซต์ร้านค้า 25 ก.ย. 2569 · สินค้าใหม่ถึง 25 ก.ย. 2569 · Google Trends ดึงเมื่อ ')}<b>${rt}</b> · ${L('launch-table trends pulled ','เทรนด์ตารางสินค้าใหม่ดึงเมื่อ ')}<b>${ltDate()}</b> · ${L('page built 4 Oct 2026. Nothing updates by itself yet.','สร้างหน้าเมื่อ 4 ต.ค. 2569 ยังไม่มีการอัปเดตอัตโนมัติ')}</div>`;
}
function vInsights(){
  const nav=[['top5','Top 5','ข้อสรุป 5 ข้อ'],['market','Market size','ขนาดตลาด'],['trends','Search trends','เทรนด์การค้นหา'],['launch','New launches','สินค้าใหม่'],['ladder','Price ladder','ราคาต่อ 100 มล.'],['rules','Health & rules','สุขภาพและกฎ'],['map','White-space map','แผนที่ช่องว่าง'],['malee','Malee numbers','ตัวเลข Malee'],['watch','Watch & refresh','ติดตามและอัปเดต']];
  return `<div class="ins-h"><h2 style="margin:0">${L('Market insights','Market insights — ข้อมูลเชิงลึกตลาด')}</h2></div>
  <p class="help">${L('A simple view of what is growing, what is crowded and what rivals are doing, to help pick 2–3 launches a year. Every number shows its source, link and date. Tags: ','มุมมองง่าย ๆ ว่าอะไรกำลังโต อะไรแออัด และคู่แข่งทำอะไร เพื่อช่วยเลือก 2–3 สินค้าใหม่ต่อปี ทุกตัวเลขมีแหล่ง ลิงก์ และวันที่ ป้าย: ')} ${LB('real')} ${LB('est')} ${LB('samp')} ${LB('nf')}. ${L('“Estimate” = our own sum or judgement. “SAMPLE” = made-up example (only in other tabs). “Not found” = we looked and could not find it. Nothing here is a recommendation; it is a list of ideas to test.','“ประมาณการ” = คำนวณเองหรือความเห็นของเรา “ตัวอย่าง” = สมมติ (อยู่ในแท็บอื่น) “ไม่พบ” = ค้นแล้วไม่เจอ ไม่มีข้อไหนเป็นคำแนะนำ เป็นรายการสิ่งที่ควรทดสอบ')}</p>
  ${fresh()}
  <div class="ins-nav noprint">${nav.map(n=>`<button data-go="ins-${n[0]}">${L(n[1],n[2])}</button>`).join('')}</div>
  ${secH('top5','Top 5 things to know','5 เรื่องที่ควรรู้',['In plain words, from the real data below.','พูดแบบง่าย ๆ จากข้อมูลจริงด้านล่าง'],LB('real'))}${top5()}</div>
  ${secH('market','1 · Market size and growth','1 · ขนาดและการเติบโตของตลาด',['How big is juice, which parts grow, which shrink?','น้ำผลไม้ใหญ่แค่ไหน ส่วนไหนโต ส่วนไหนหด'],LB('real'))}${vMarket()}</div>
  ${secH('trends','2 · What Thai people search for (Google Trends, 5 years)','2 · คนไทยค้นหาอะไร (Google Trends 5 ปี)',['Is interest rising or falling? When is the busy season? What new searches pop up?','ความสนใจเพิ่มหรือลด ฤดูไหนค้นหาเยอะ มีคำค้นใหม่อะไรขึ้นมา'],LB('real'))}${vTrends()}${SL('trends',L('Retrieved with refresh/pull_trends.py (pytrends), Thailand, last 5 years, weekly.','ดึงด้วย refresh/pull_trends.py (pytrends) ไทย 5 ปีล่าสุด รายสัปดาห์'))}</div>
  ${secH('launch','3 · Competitor and new-launch tracker','3 · ติดตามคู่แข่งและสินค้าใหม่',['Who launched what, when, at what price?','ใครเปิดตัวอะไร เมื่อไร ราคาเท่าไร'],LB('real'))}${vLaunch()}</div>
  ${secH('ladder','4 · Price ladder — ฿ per 100 ml','4 · ตารางราคา — ฿ ต่อ 100 มล.',['Where do prices bunch up, and where is there a gap?','ราคากองรวมกันตรงไหน และมีช่องว่างตรงไหน'],LB('real'))}${vLadder()}</div>
  ${secH('rules','5 · Health trends, rules and retail signals','5 · เทรนด์สุขภาพ กฎหมาย และสัญญาณร้านค้า',['What shapes what we are allowed to say and sell?','อะไรกำหนดสิ่งที่เราเขียนและขายได้'],LB('real')+' '+LB('nf'))}${vRules()}</div>
  ${secH('map','6 · White-space map — ideas to test (not recommendations)','6 · แผนที่ช่องว่างตลาด — ไอเดียที่ควรทดสอบ (ไม่ใช่คำแนะนำ)',['12 ideas placed by growth and crowding. The scores are our reading of the evidence below.','12 ไอเดียวางตามการเติบโตและความแออัด คะแนนคือการอ่านหลักฐานของเรา'],LB('est'))}
   <div class="help">${L('<b>How the scores work.</b> Growth: 5 = a real source shows +20% or more; 4 = +10 to +20%; 3 = 0 to +10%; 2 = −10% to 0; 1 = worse than −10%. Where no figure was found the idea sits in the grey band. Crowding: 1 = no more than 1 brand seen; 2 = 1–2; 3 = 3; 4 = 4+ or big brands; 5 = 5+ brands with price cuts. “Brands seen” only counts what we saw, so crowding can be under-counted. Colour = how strong the evidence is: green strong (two or more real sources agree), amber medium (one real source or borrowed from a wider category), grey weak (company claim or none).','<b>วิธีให้คะแนน</b> การเติบโต: 5 = แหล่งจริงบอก +20% ขึ้นไป; 4 = +10 ถึง +20%; 3 = 0 ถึง +10%; 2 = −10% ถึง 0; 1 = แย่กว่า −10% ถ้าไม่พบตัวเลขจะวางในแถบสีเทา ความแออัด: 1 = เจอไม่เกิน 1 แบรนด์; 2 = 1–2; 3 = 3; 4 = 4+ หรือแบรนด์ใหญ่; 5 = 5+ แบรนด์พร้อมลดราคา “แบรนด์ที่เจอ” นับเฉพาะที่เราเห็น จึงอาจนับขาด สี = ความแข็งของหลักฐาน: เขียว แข็ง (แหล่งจริงตั้งแต่ 2 แหล่งตรงกัน) เหลือง กลาง (แหล่งจริง 1 แหล่งหรือยืมจากหมวดกว้าง) เทา อ่อน (คำอ้างบริษัทหรือไม่มี)')}</div>
   <div class="ws-wrap"><div class="card"><div style="margin-bottom:4px"><span class="lg"><i style="background:${EVCOL.strong}"></i>${L('strong','แข็ง')}</span><span class="lg"><i style="background:${EVCOL.medium}"></i>${L('medium','กลาง')}</span><span class="lg"><i style="background:${EVCOL.weak}"></i>${L('weak','อ่อน')}</span></div>${wsScatter()}</div><div class="card">${wsList()}</div></div>

document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(!g)return;const el=document.getElementById(g.dataset.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.insf){INS[t.dataset.insf]=t.value;const y=window.scrollY;document.getElementById('p-insights').innerHTML=vInsights();window.scrollTo(0,y)}});

/* ===== app.js ===== */
const LS={get(k,d){try{const v=localStorage.getItem('maleeNPD.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('maleeNPD.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('maleeNPD.'+k)}catch(e){}}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={tab:'insights',lang:LS.get('lang','en'),weights:LS.get('weights',CRIT.map(c=>c.w)),
  ideas:LS.get('ideas',null)||IDEAS0.map(i=>({...i,s:i.s.slice(),custom:false})),
  go:LS.get('go',3.5),kill:LS.get('kill',2.8),slots:LS.get('slots',3),
  chkIdea:'S-05',chk:LS.get('chk',{'S-05':{c1:1,c2:1,c3:1,l1:1,l2:1,t1:1,m1:1,k1:1}}),chkNote:LS.get('chkNote',{}),
  scen:'B',thr:LS.get('thr',{killST:40,killWk:12,scaleST:100,scaleRep:25,pxMax:110,fixRep:20,minWk:8}),own:null,
  pm:LS.get('pm',{}),conn:LS.get('conn',{})};
const L=(en,th)=>state.lang==='th'?th:en;
const T=o=>state.lang==='th'?o.th:o.en;
const SAMP=()=>`<span class="tag">${L('SAMPLE','ตัวอย่าง')}</span>`;
const PUB=()=>`<span class="tag pub">${L('PUBLIC FACT','ข้อมูลสาธารณะ')}</span>`;

/* ---------- scoring ---------- */
const wsum=()=>state.weights.reduce((a,b)=>a+(+b||0),0)||1;
function total(i){let t=0;CRIT.forEach((c,k)=>t+=(+state.weights[k]||0)*(+i.s[k]||0));return t/wsum()}
const knock=i=>(+i.s[5]===1);
function verdict(i){const t=total(i);if(knock(i))return 'kill';if(t>=state.go)return 'go';if(t<state.kill)return 'kill';return 'hold'}
const vlabel=(v,i)=>(i&&knock(i))?L('Auto-stop','หยุดทันที'):({go:L('Pass','ผ่าน'),hold:L('Wait and rework','รอและปรับไอเดีย'),kill:L('Below the stop mark','ต่ำกว่าคะแนนหยุด')}[v]);
const f1=x=>x.toFixed(2);
function scoreChip(i){const v=verdict(i);return `<span class="score ${v}" data-total-of="${i.id}">${f1(total(i))}</span>`}
function evChip(i){const e=EVID[i.ev];return `<span class="ev l${e.l}"><i></i>${esc(T(e))}</span>`}

/* ---------- tabs ---------- */
const TABS=[['insights','Market insights','ข้อมูลตลาด'],['summary','Summary','สรุป'],['score','Score the ideas','ให้คะแนนไอเดีย'],['data','Data we need','ข้อมูลที่ต้องการ'],['board','Steps before launch','ขั้นตอนก่อนเปิดตัว'],['ready','Ready to launch?','พร้อมเปิดตัวไหม'],['post','After launch','หลังเปิดตัว'],['mortem','Learn from the past','เรียนรู้จากอดีต']];
function renderTabs(){document.querySelector('#tabs .wrap').innerHTML=TABS.map(t=>`<button data-tab="${t[0]}" class="${state.tab===t[0]?'on':''}">${L(t[1],t[2])}</button>`).join('')}

  document.getElementById('thnote').textContent='ข้อความภาษาไทยในหน้านี้เขียนโดยเครื่อง ต้องให้เจ้าของภาษาตรวจก่อนใช้จริง · Thai text is machine-written. A native speaker must check it before real use.';

  document.getElementById('foot').textContent=L('Unofficial, independent analysis built from public sources. It is not a Malee publication and has not been reviewed or confirmed by Malee Group. Market insights = real public data (each item labelled real / estimate / not found, with its source). Everything else = SAMPLE, not real Malee numbers. Page rebuilt 8 Nov 2026 (Bangkok time). Source dates differ: Google Trends categories pulled 8 Nov 2026; launch search trends pulled 8 Nov 2026; retailer prices checked 25 Sep 2026; desk research and company figures as of 4 Oct 2026 (each item shows its own source date). Starting weights and marks are ideas to talk about, not Malee rules.','การวิเคราะห์อิสระที่ไม่เป็นทางการ จัดทำจากแหล่งข้อมูลสาธารณะ ไม่ใช่เอกสารเผยแพร่ของ Malee และ Malee Group ยังไม่ได้ตรวจสอบหรือยืนยัน แท็บ Market insights = ข้อมูลจริงจากแหล่งสาธารณะ (แต่ละรายการมีป้ายจริง / ประมาณการ / ไม่พบ พร้อมแหล่งที่มา) ส่วนอื่นทั้งหมด = ข้อมูลตัวอย่าง ไม่ใช่ตัวเลขจริงของ Malee สร้างหน้านี้ใหม่ 8 พ.ย. 2569 (เวลากรุงเทพฯ) วันที่ของแหล่งข้อมูลต่างกัน: Google Trends หมวดสินค้าดึงเมื่อ 8 พ.ย. 2569 เทรนด์การค้นหาสินค้าใหม่ดึงเมื่อ 8 พ.ย. 2569 ราคาจากเว็บไซต์ร้านค้า 25 ก.ย. 2569 งานวิจัยและตัวเลขบริษัท ณ 4 ต.ค. 2569 (แต่ละรายการแสดงวันที่ของแหล่งที่มา) น้ำหนักและคะแนนเริ่มต้นเป็นแค่ข้อเสนอให้คุยกัน ไม่ใช่กฎของ Malee');
  document.body.dataset.tb=state.tab;renderTabs();

  <h3 class="sec">${L('Do first (next 30 days)','ทำก่อน (30 วันแรก)')}</h3>
  <div class="acts">
   ${[['Gather records of the last 3–5 launches. Fill in one lessons-learned form for each (tab 6).','รวบรวมบันทึกการเปิดตัว 3–5 รายการล่าสุด แล้วกรอกแบบเรียนรู้จากการเปิดตัวรายการละ 1 ฉบับ (แท็บ 6)','1'],['Agree the 8 score points and their weights with Marketing, NPD, Sales, Finance, the factory and Legal (tab 3).','ตกลงหัวข้อให้คะแนน 8 ข้อและน้ำหนัก กับฝ่ายการตลาด NPD ขาย การเงิน โรงงาน และกฎหมาย (แท็บ 3)','2'],['Write the “stop if…” rules for each check-point before the next idea is scored (tab 2).','เขียนกฎ “หยุดถ้า…” ของแต่ละจุดตรวจ ก่อนให้คะแนนไอเดียถัดไป (แท็บ 2)','3'],['Pick the next idea. Run one cheap test with real shoppers and ask 3 shop buyers, before spending more.','เลือกไอเดียถัดไป ทดสอบถูกๆ กับผู้ซื้อจริงหนึ่งครั้งและถามผู้ซื้อของห้าง 3 ราย ก่อนใช้เงินเพิ่ม','4'],['Ask for weekly sales to shoppers and store counts, so the After launch tab can use real numbers (tab 7).','ขอยอดที่ผู้ซื้อซื้อจริงและจำนวนร้านรายสัปดาห์ เพื่อให้แท็บหลังเปิดตัวใช้ตัวเลขจริง (แท็บ 7)','5']].map(a=>`<div class="card act"><div class="ahead"><span class="rank">${a[2]}</span><b>${L(a[0],a[1])}</b></div></div>`).join('')}
  </div>

  <h3 class="sec">${L('Simple word list','คำศัพท์ง่ายๆ')}</h3>
  <div class="gloss">
   ${[['Check-point (gate)','จุดตรวจ (gate)','A stop on the road to launch. A small group decides: go on, wait or stop.','จุดหยุดตรวจระหว่างทางสู่การเปิดตัว คนกลุ่มเล็กตัดสินว่า ไปต่อ รอ หรือหยุด'],['Stop rules','กฎหยุด','Rules agreed before testing that say when to stop an idea. No arguing later.','กฎที่ตกลงก่อนทดสอบว่าเมื่อไรต้องหยุดไอเดีย จะได้ไม่ต้องเถียงกันทีหลัง'],['Shopper test (concept test)','ถามผู้ซื้อ (ทดสอบไอเดีย)','Show the idea on a card to real shoppers. See how much they like it next to a product on sale now.','ให้ผู้ซื้อจริงดูไอเดียบนการ์ด แล้วดูว่าชอบแค่ไหนเมื่อเทียบกับสินค้าที่ขายอยู่'],['Test sale (pilot)','ขายทดลอง','A small real sale for a short time in a few stores or online, before selling everywhere.','ขายจริงในระดับเล็กช่วงสั้นๆ ที่ไม่กี่ร้านหรือออนไลน์ ก่อนขายทุกที่'],['Sales vs plan (sell-through)','ยอดขายเทียบแผน','What shoppers really bought. Not what we sent to the shop. 100 = on plan.','สิ่งที่ผู้ซื้อซื้อจริง ไม่ใช่ที่เราส่งเข้าร้าน 100 = ตามแผน'],['Stores selling it (distribution points)','จำนวนร้านที่ขาย','How many stores have it on the shelf. No shelf, no sale.','มีกี่ร้านที่วางสินค้าบนชั้น ไม่มีชั้นวาง ก็ไม่มียอดขาย'],['Buy again (repeat rate)','ซื้อซ้ำ','Share of buyers who come back and buy again. The best early sign of a winner.','สัดส่วนผู้ซื้อที่กลับมาซื้ออีก เป็นสัญญาณแรกที่ดีที่สุดของสินค้าที่ไปรอด'],['Our price vs rivals (price index)','ราคาเราเทียบคู่แข่ง','Our shelf price divided by rivals’ price, times 100. 100 = same price. 110 = we cost 10% more.','ราคาหน้าชั้นของเราหารด้วยราคาคู่แข่ง คูณ 100 โดย 100 = ราคาเท่ากัน 110 = เราแพงกว่า 10%'],['Steals our own sales (cannibalisation)','แย่งยอดสินค้าเราเอง','Sales of the new product that just come from our own older products.','ยอดของสินค้าใหม่ที่แค่ย้ายมาจากสินค้าเดิมของเราเอง'],['Auto-stop (knock-out)','หยุดทันที','One problem so serious that the idea stops, whatever its total score.','ปัญหาเดียวที่ร้ายแรงจนต้องหยุดไอเดีย ไม่ว่าคะแนนรวมเท่าไร'],['Shop agrees to stock it (listing)','ร้านรับสินค้า (listing)','The shop puts the product on its list and gives it a place.','ร้านใส่สินค้าไว้ในรายการของร้านและให้ที่วาง'],['Deal with the shops (trade terms)','ข้อตกลงกับร้านค้า','Fees, the shop’s profit share, returns and payment.','ค่าธรรมเนียม ส่วนแบ่งกำไรของร้าน การคืนสินค้า และการจ่ายเงิน'],['Product item (SKU)','สินค้าหนึ่งรายการ (SKU)','One product in one size and flavour.','สินค้าหนึ่งอย่าง ขนาดเดียว รสเดียว'],['Profit on each sale (margin)','กำไรต่อชิ้น','What is left after the cost of making and selling it.','ส่วนที่เหลือหลังหักต้นทุนผลิตและขาย'],['Big stores (modern trade)','ห้างใหญ่ (โมเดิร์นเทรด)','Supermarkets, hypermarkets and convenience-store chains.','ซูเปอร์มาร์เก็ต ไฮเปอร์มาร์เก็ต และร้านสะดวกซื้อเครือใหญ่'],['NPD','NPD','New product development. Everything from the first idea to a product on shelf.','การพัฒนาสินค้าใหม่ ทุกอย่างตั้งแต่ไอเดียแรกจนสินค้าอยู่บนชั้น']].map(g=>`<div><b>${L(g[0],g[1])}</b><div class="note">${L(g[2],g[3])}</div></div>`).join('')}
  </div>`;
}

/* ---------- BOARD ---------- */
function vBoard(){
  const cols=STAGES.map((s,si)=>{
    const cards=state.ideas.filter(i=>i.stage===si).sort((a,b)=>total(b)-total(a));
    return `<div class="col"><h4>${esc(T({en:s.en,th:s.th}))}</h4><p class="gq">${L(s.gq_en,s.gq_th)}</p>
     <details><summary>${L('Cheapest test and stop rules','วิธีทดสอบที่ถูกที่สุดและกฎหยุด')}</summary><div class="note" style="margin-top:4px">${L(s.test_en,s.test_th)}</div><div class="k2" style="margin-top:6px">${L('Stop or fix if…','หยุดหรือแก้ ถ้า…')}</div><ul>${(state.lang==='th'?s.kill_th:s.kill_en).map(k=>`<li>${esc(k)}</li>`).join('')}</ul></details>
     ${cards.length?cards.map(i=>{const v=verdict(i);return `<div class="icard"><div class="nm"><span class="id">${esc(i.id)}</span>${esc(i.custom?i.en:T(i))}</div>
       <div class="row2">${scoreChip(i)}<span class="note">${vlabel(v,i)}</span></div>
       <div class="row2" style="margin-top:5px">${evChip(i)}</div>
       ${knock(i)?`<div class="flag">⚠ ${L('Auto-stop: the rules-and-claims score is 1','หยุดทันที: คะแนนกฎหมายและคำโฆษณาเป็น 1')}</div>`:''}
       ${EVID[i.ev].l<=2&&si>=1?`<div class="flag" style="color:var(--warn)">${L('Proof is too weak for this step','หลักฐานยังอ่อนเกินไปสำหรับขั้นนี้')}</div>`:''}
       <div style="margin-top:6px"><button class="btn" style="padding:1px 8px;font-size:11.5px" data-mv="${esc(i.id)}" data-d="-1" ${si===0?'disabled':''}>←</button> <button class="btn" style="padding:1px 8px;font-size:11.5px" data-mv="${esc(i.id)}" data-d="1" ${si===5?'disabled':''}>→</button></div></div>`}).join(''):`<div class="empty">${L('No sample ideas here','ไม่มีไอเดียตัวอย่างตรงนี้')}</div>`}
    </div>`}).join('');
  return `<div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${L('Steps before launch','ขั้นตอนก่อนเปิดตัว')} ${SAMP()}</h2></div>
  <p class="help">${L('Ideas move from left to right. Before each step there is a check-point. A short meeting decides: go on, wait, or stop. The rules are agreed beforehand. Each card’s score comes from tab 3. Change a weight there and this board changes too. The arrows only move cards for a demo.','ไอเดียเคลื่อนจากซ้ายไปขวา ก่อนแต่ละขั้นมีจุดตรวจ ประชุมสั้นๆ เพื่อตัดสินว่า ไปต่อ รอ หรือหยุด โดยใช้กฎที่ตกลงกันไว้ก่อน คะแนนบนการ์ดมาจากแท็บ 3 ถ้าเปลี่ยนน้ำหนักที่นั่น บอร์ดนี้ก็เปลี่ยนตาม ลูกศรใช้ย้ายการ์ดเพื่อสาธิตเท่านั้น')}</p>
  <div class="callout warn">${L('All ten ideas are made up and general. They are not Malee ideas. The scores are not Malee’s opinion. The dot shows how solid the proof is: red = opinion only, green = real sales.','ไอเดียทั้ง 10 รายการสมมติและกว้างๆ ไม่ใช่ไอเดียของ Malee คะแนนไม่ใช่ความเห็นของ Malee จุดสีบอกว่าหลักฐานแน่นแค่ไหน: แดง = ความเห็นเฉยๆ เขียว = ยอดขายจริง')}</div>
  <div class="board">${cols}</div>
  <h3 class="sec">${L('Launch places','ที่เปิดตัว')} ${SAMP()}</h3>
  ${slotsHTML()}`;
}
function slotsHTML(){
  const elig=ready().sort((a,b)=>total(b)-total(a));
  let h='<div class="slotrow">';
  for(let k=0;k<state.slots;k++){const i=elig[k];h+=i?`<div class="slot fill"><b>${L('Place','ที่')} ${k+1}</b> · ${esc(i.id)} · ${f1(total(i))}</div>`:`<div class="slot"><b>${L('Place','ที่')} ${k+1}</b> · <span class="empty">${L('empty: no idea passes','ว่าง: ไม่มีไอเดียผ่าน')}</span></div>`}
  h+=`</div><p class="note">${L('Malee says it plans 2–3 new products a year. The places above are filled by score, from ideas that pass the pass mark and have not launched yet. Change the number of places or the pass mark in tab 3.','Malee บอกว่าวางแผนสินค้าใหม่ 2–3 รายการต่อปี ที่ด้านบนเติมตามคะแนน จากไอเดียที่ผ่านคะแนนผ่านและยังไม่ได้เปิดตัว เปลี่ยนจำนวนที่หรือคะแนนผ่านได้ในแท็บ 3')}</p>`;
  return h;
}

/* ---------- SCORECARD ---------- */
function vScore(){
  const rows=state.ideas.slice().sort((a,b)=>total(b)-total(a)).map(i=>`<tr data-row="${esc(i.id)}"><td class="nm">${i.custom?`<input type="text" data-name="${esc(i.id)}" value="${esc(i.en)}" style="width:100%;border:1px solid var(--line);border-radius:6px;padding:3px 6px;font:inherit">`:`<span class="note">${esc(i.id)}</span> ${esc(T(i))}${(wsFor(i.id)?`<br><span class="evd ${wsFor(i.id)[5]}" title="${esc(L('Market evidence (see Market insights)','หลักฐานตลาด (ดูแท็บ Market insights)'))}">${L('market evidence','หลักฐานตลาด')}: ${L(EVN[wsFor(i.id)[5]][0],EVN[wsFor(i.id)[5]][1])}</span>`:'')}`}</td>
   <td>${evChip(i)}</td>
   ${CRIT.map((c,k)=>`<td class="num"><input type="number" min="1" max="5" step="1" value="${i.s[k]}" data-sc="${esc(i.id)}" data-k="${k}" aria-label="${esc(c.en)}"></td>`).join('')}
   <td class="num"><span data-total-of="${esc(i.id)}" class="score ${verdict(i)}">${f1(total(i))}</span></td>
   <td data-vl="${esc(i.id)}">${knock(i)?`<span class="pill high">${L('Auto-stop','หยุดทันที')}</span>`:`<span class="pill ${({go:'ok',hold:'med',kill:'high'})[verdict(i)]}">${vlabel(verdict(i))}</span>`}</td></tr>`).join('');
  return `<div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0">${L('Score the ideas','ให้คะแนนไอเดีย')} ${SAMP()}</h2></div>

/* ---------- POST-LAUNCH ---------- */
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genScen(k){
  const r=mul(k==='A'?11:k==='B'?22:33),N=26,rows=[];
  for(let w=1;w<=N;w++){
    const n=()=>(r()-.5)*6;let dist,st,rep,px;
    if(k==='A'){dist=2300*(1-Math.exp(-w/5));st=55+62*(1-Math.exp(-w/7))+n();rep=w<8?null:20+(w-8)*0.75+n()/3;px=103+n()/3}
    else if(k==='B'){dist=1900*(1-Math.exp(-w/4));st=(w<9?50+6*w:104-(w-9)*2.1)+n();rep=w<8?null:15-(w-8)*0.12+n()/4;px=117+n()/3}
    else{dist=(w<10?65*w:650)+n()*5;st=w<5?45-w*1.5+n():38-(w-5)*0.8+n();rep=w<8?null:9+n()/4;px=108+n()/3}
    rows.push({w,st:Math.max(5,+st.toFixed(1)),dist:Math.round(dist),rep:rep==null?null:+Math.max(2,rep).toFixed(1),px:+px.toFixed(1)});
  }
  return rows;
}
function evalSeries(rows){
  const T=state.thr,n=rows.length,l4=rows.slice(-4);
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const st=avg(l4.map(r=>r.st)),px=avg(l4.map(r=>r.px)),dnow=rows[n-1].dist,dthen=rows[Math.max(0,n-5)].dist,dg=dthen?(dnow/dthen-1):0;
  const reps=rows.filter(r=>r.rep!=null),rep=reps.length?reps[reps.length-1].rep:null;
  let v,why=[];
  if(n<T.minWk){v='wait';why.push(L(`Only ${n} weeks of data. Wait until week ${T.minWk} to decide.`,`มีข้อมูลแค่ ${n} สัปดาห์ รอถึงสัปดาห์ที่ ${T.minWk} ค่อยตัดสิน`))}
  else if(st<T.killST&&dg<0.05&&n>=T.killWk){v='kill';why.push(L(`Sales vs plan is ${st.toFixed(0)} (last 4 weeks). That is below the stop level of ${T.killST}.`,`ยอดขายเทียบแผนอยู่ที่ ${st.toFixed(0)} (4 สัปดาห์ล่าสุด) ต่ำกว่าระดับหยุดที่ ${T.killST}`));why.push(L(`The number of stores selling it changed by only ${(dg*100).toFixed(0)}% in 4 weeks. No more shelves are coming.`,`จำนวนร้านที่ขายเปลี่ยนแค่ ${(dg*100).toFixed(0)}% ใน 4 สัปดาห์ จะไม่มีชั้นวางเพิ่มแล้ว`));why.push(L('Next: fill in the lessons-learned form (tab 6) before you clear the stock.','ขั้นต่อไป: กรอกแบบเรียนรู้จากการเปิดตัว (แท็บ 6) ก่อนเคลียร์สต็อก'))}
  else if(st>=T.scaleST&&rep!=null&&rep>=T.scaleRep&&px<=T.pxMax){v='scale';why.push(L(`Sales vs plan ${st.toFixed(0)} is at least ${T.scaleST}. Buy-again ${rep.toFixed(0)}% is at least ${T.scaleRep}%. Our price vs rivals ${px.toFixed(0)} is at most ${T.pxMax}.`,`ยอดขายเทียบแผน ${st.toFixed(0)} ไม่ต่ำกว่า ${T.scaleST} ซื้อซ้ำ ${rep.toFixed(0)}% ไม่ต่ำกว่า ${T.scaleRep}% ราคาเราเทียบคู่แข่ง ${px.toFixed(0)} ไม่เกิน ${T.pxMax}`));why.push(L('Next: add stores and flavours. Keep supply safe.','ขั้นต่อไป: เพิ่มร้านและรสชาติ ดูแลให้มีของส่งพอ'))}
  else{v='fix';
    if(rep!=null&&rep<T.fixRep)why.push(L(`Only ${rep.toFixed(0)}% buy again (the target is ${T.fixRep}%). People try it but do not come back. Check taste, pack size and price.`,`ซื้อซ้ำแค่ ${rep.toFixed(0)}% (เป้า ${T.fixRep}%) คนลองแล้วไม่กลับมาซื้อ ลองดูเรื่องรส ขนาดแพ็ก และราคา`));
    if(px>T.pxMax)why.push(L(`Our price is ${px.toFixed(0)} vs rivals (100 = same). That is above ${T.pxMax}: we cost more than the rivals’ basket.`,`ราคาเราเทียบคู่แข่งอยู่ที่ ${px.toFixed(0)} (100 = เท่ากัน) สูงกว่า ${T.pxMax}: เราแพงกว่าสินค้าคู่แข่ง`));
    if(st<T.scaleST&&dg<0.05)why.push(L('Sales are below plan and no new stores are being added. Check if the shops put it on their lists, and the deal with the shops.','ยอดขายต่ำกว่าแผนและไม่มีร้านเพิ่ม ตรวจว่าห้างรับสินค้าเข้าระบบหรือยัง และข้อตกลงกับห้าง'));
    else if(st<T.scaleST)why.push(L('Sales are below plan, but more stores are still being added. Check if people know about it, try it, and can see it in store.','ยอดขายต่ำกว่าแผน แต่ร้านยังเพิ่มอยู่ ตรวจว่าคนรู้จักไหม ได้ลองไหม และเห็นสินค้าในร้านไหม'));
    if(!why.length)why.push(L('Close to the “grow” level, but not there yet.','ใกล้ระดับ “ขยาย” แล้ว แต่ยังไม่ถึง'))}
  return {v,why,st,px,rep,dg};
}
function chart(rows,key,o){
  const W=400,H=150,pl=34,pr=8,pt=10,pb=22;const vals=rows.map(r=>r[key]).filter(x=>x!=null);
  const lo=o.min!=null?o.min:Math.min(...vals,...(o.lines||[]).map(l=>l.y))*.85,hi=o.max!=null?o.max:Math.max(...vals,...(o.lines||[]).map(l=>l.y))*1.12;
  const X=w=>pl+(w-1)/(rows.length-1)*(W-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  let d='',pen=false;rows.forEach(r=>{if(r[key]==null){pen=false;return}d+=(pen?'L':'M')+X(r.w).toFixed(1)+' '+Y(r[key]).toFixed(1);pen=true});
  const ticks=[0,.5,1].map(f=>lo+(hi-lo)*f);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title)}">
   ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="#e6e9e8"/><text x="${pl-4}" y="${(Y(t)+3).toFixed(1)}" font-size="9" fill="#98a1a5" text-anchor="end">${Math.round(t)}</text>`).join('')}
   ${(o.lines||[]).map(l=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(l.y).toFixed(1)}" y2="${Y(l.y).toFixed(1)}" stroke="${l.c}" stroke-dasharray="4 3"/><text x="${W-pr}" y="${(Y(l.y)-3).toFixed(1)}" font-size="9" fill="${l.c}" text-anchor="end">${esc(l.t)}</text>`).join('')}
   <path d="${d}" fill="none" stroke="${o.c||'#0a7b5c'}" stroke-width="2"/>
   <text x="${pl}" y="${H-6}" font-size="9" fill="#98a1a5">${L('week 1','สัปดาห์ 1')}</text><text x="${W-pr}" y="${H-6}" font-size="9" fill="#98a1a5" text-anchor="end">${L('week','สัปดาห์')} ${rows.length}</text></svg>`;
}

function parseCSV(txt){
  const ls=txt.replace(/\r/g,'').split('\n').map(s=>s.trim()).filter(Boolean);if(ls.length<5)throw new Error(L('Needs a first row of column names and at least 4 weeks of data.','ต้องมีแถวชื่อคอลัมน์ และข้อมูลอย่างน้อย 4 สัปดาห์'));
  const h=ls[0].toLowerCase().split(',').map(s=>s.trim());const ix=n=>h.indexOf(n);
  const need=['week','sell_through_index','distribution_points','repeat_rate_pct','price_index'];
  for(const n of need)if(ix(n)<0)throw new Error(L('Missing column: ','ไม่มีคอลัมน์: ')+n);
  return ls.slice(1).map((l,k)=>{const c=l.split(',');const num=(n,opt)=>{const v=(c[ix(n)]||'').trim();if(v==='')return opt?null:NaN;const x=+v;if(isNaN(x))throw new Error(L('Not a number on row ','ไม่ใช่ตัวเลขที่แถว ')+(k+2)+': '+n);return x};
    const r={w:k+1,st:num('sell_through_index'),dist:num('distribution_points'),rep:num('repeat_rate_pct',1),px:num('price_index')};
    if([r.st,r.dist,r.px].some(isNaN))throw new Error(L('Empty value on row ','ช่องว่างที่แถว ')+(k+2));return r});
}

  const t=e.target.closest('[data-tab],[data-lang],[data-mv],[data-act],[data-scen]');if(!t)return;
  if(t.dataset.tab){state.tab=t.dataset.tab;render();window.scrollTo({top:0});return}
  if(t.dataset.lang){state.lang=t.dataset.lang;LS.set('lang',state.lang);render();return}
  if(t.dataset.scen){state.scen=t.dataset.scen;render();return}
  if(t.dataset.mv){const i=state.ideas.find(x=>x.id===t.dataset.mv);i.stage=Math.max(0,Math.min(5,i.stage+(+t.dataset.d)));LS.set('ideas',state.ideas);render();return}
  const a=t.dataset.act;
  if(a==='print'){window.print();return}
  if(a==='addidea'){const n=state.ideas.filter(i=>i.custom).length+1;state.ideas.push({id:'N-'+String(n).padStart(2,'0'),stage:0,ev:'opinion',en:'New idea (type a name)',th:'ไอเดียใหม่ (พิมพ์ชื่อ)',s:[3,3,3,3,3,3,3,3],custom:true});LS.set('ideas',state.ideas);render();return}
  if(a==='csv'){csvScore();return}
  if(a==='resetscore'){if(confirm(L('Reset weights, scores and added ideas back to the sample?','ย้อนน้ำหนัก คะแนน และไอเดียที่เพิ่มกลับเป็นตัวอย่างหรือไม่'))){state.weights=CRIT.map(c=>c.w);state.ideas=IDEAS0.map(i=>({...i,s:i.s.slice(),custom:false}));state.go=3.5;state.kill=2.8;state.slots=3;['weights','ideas','go','kill','slots'].forEach(k=>LS.del(k));render()}return}
  if(a==='clearchk'){state.chk[state.chkIdea]={};LS.set('chk',state.chk);render();return}
  if(a==='loadcsv'){const err=document.getElementById('csverr');try{state.own=parseCSV(document.getElementById('csvbox').value);render()}catch(x){err.textContent=x.message}return}
  if(a==='tplcsv'){dl('post-launch-tracker-template.csv','week,sell_through_index,distribution_points,repeat_rate_pct,price_index\n1,,,,\n2,,,,\n3,,,,\n4,,,,\n','text/csv');return}
  if(a==='backsample'){state.own=null;render();return}
  if(a==='pmcopy'){const m=document.getElementById('pmmsg');navigator.clipboard.writeText(pmMarkdown()).then(()=>m.textContent=L('Copied.','คัดลอกแล้ว'),()=>m.textContent=L('The browser blocked copying. Use Download.','เบราว์เซอร์ไม่ให้คัดลอก ใช้ปุ่มดาวน์โหลดแทน'));return}
  if(a==='pmdl'){dl('launch-post-mortem.md',pmMarkdown(),'text/markdown');return}
  if(a==='pmprint'){window.print();return}
  if(a==='pmclear'){if(confirm(L('Clear every answer in the form?','ล้างทุกคำตอบในแบบฟอร์มหรือไม่'))){state.pm={};LS.del('pm');render()}return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.sc!==undefined){const i=state.ideas.find(x=>x.id===t.dataset.sc);let v=Math.round(+t.value);if(!(v>=1))v=1;if(v>5)v=5;i.s[+t.dataset.k]=v;LS.set('ideas',state.ideas);refreshScoreCells();return}
  if(t.dataset.w!==undefined){state.weights[+t.dataset.w]=Math.max(0,+t.value||0);LS.set('weights',state.weights);refreshScoreCells();return}
  if(t.dataset.name!==undefined){state.ideas.find(x=>x.id===t.dataset.name).en=t.value;LS.set('ideas',state.ideas);return}
  if(t.dataset.cn!==undefined){(state.chkNote[state.chkIdea]=state.chkNote[state.chkIdea]||{})[t.dataset.cn]=t.value;LS.set('chkNote',state.chkNote);return}
  if(t.dataset.pm!==undefined){state.pm[t.dataset.pm]=t.value;LS.set('pm',state.pm);return}
  if(t.dataset.co!==undefined){(state.conn[t.dataset.co]=state.conn[t.dataset.co]||{}).o=t.value;LS.set('conn',state.conn);return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.cfg){const k=t.dataset.cfg;if(k==='chkIdea'){state.chkIdea=t.value;render();return}state[k]=+t.value;LS.set(k,state[k]);render();return}
  if(t.dataset.ck){chkState()[t.dataset.ck]=t.checked?1:0;LS.set('chk',state.chk);render();return}
  if(t.dataset.pmc!==undefined){(state.pm.causes=state.pm.causes||{})[t.dataset.pmc]=t.checked?1:0;LS.set('pm',state.pm);return}
  if(t.dataset.thr){state.thr[t.dataset.thr]=+t.value;LS.set('thr',state.thr);render();return}
  if(t.dataset.cs!==undefined){(state.conn[t.dataset.cs]=state.conn[t.dataset.cs]||{}).s=+t.value;LS.set('conn',state.conn);return}
  if(t.id==='csvfile'&&t.files[0]){const r=new FileReader();r.onload=()=>{document.getElementById('csvbox').value=r.result};r.readAsText(t.files[0])}
});
function fitNav(){const b=document.querySelector('.banner');document.querySelector('nav.tabs').style.top=b.offsetHeight+'px'}
window.addEventListener('resize',fitNav);
render();fitNav();

</script>
</body>
</html>
